<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 472" width="880" height="472" role="img" aria-labelledby="title desc">
<title id="title">The processes of the workbench</title>
<desc id="desc">The designer edits the model folder, runs the start script, and opens the page. The start script starts one Node.js process that holds the host and the Vite development server. The host reads the model folder and sends each snapshot through the Vite development server to the page in the web browser.</desc>
