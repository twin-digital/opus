<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 632" width="880" height="632" role="img" aria-labelledby="title desc">
<title id="title">Entity diagram: the model folder</title>
<desc id="desc">The model folder has five entities. A component type has zero or more fields. An entity has zero or more components, and each component has one component type. A component has zero or more field values, and each field value has one field. A field value of the type reference-list has zero or more entities, and an entity has zero or more field values that refer to it.</desc>
