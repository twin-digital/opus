<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 528" width="880" height="528" role="img" aria-labelledby="title desc">
<title id="title">From a file to a picture</title>
<desc id="desc">The definition file and the state file go to the host, which makes a snapshot. The renderer takes the props from the snapshot and the view from the table of views. The view file and its sidecar make the table of views. The sidecar gives the component type ID of the view. The renderer draws the app bar in a marked element.</desc>
