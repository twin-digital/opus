<title id="title">From a file to a picture</title>
<desc id="desc">The definition file and the state file go to the host, which makes a snapshot. The renderer takes the props from the snapshot and the view from the table of views. The table of views comes from the view file. The renderer draws the app bar in a marked element.</desc>
