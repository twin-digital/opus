<text x="440" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#a3a3b8" text-anchor="middle">[web browser]</text>
<rect x="24" y="304" width="832" height="44" rx="12" fill="#1b1b30" stroke="#45455d"/>
<text x="40" y="330.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#c2d0ea" text-anchor="start">Legend</text>
<rect x="100.64" y="318" width="26" height="16" rx="5" fill="#2f3146" stroke="#45455d"/>
<text x="134.64" y="330.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#a3a3b8" text-anchor="start">Person</text>
<rect x="195.84" y="318" width="26" height="16" rx="5" fill="#f2a93b" stroke="none"/>
<text x="229.84" y="330.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#a3a3b8" text-anchor="start">Software system</text>
<path d="M355.84 326 L371.84 326" stroke="#6b6b88" stroke-width="2.5" stroke-linecap="round"/>
