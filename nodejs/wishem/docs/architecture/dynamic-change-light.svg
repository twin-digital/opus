<rect x="195.84" y="438" width="26" height="16" rx="5" fill="#ffffff" stroke="#c4c4cf"/>
<text x="229.84" y="450.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#5b5b70" text-anchor="start">Container</text>
<path d="M312.64 442 a13 4 0 0 1 26 0 v8 a13 4 0 0 1 -26 0 z" fill="#ffffff" stroke="#c4c4cf"/>
<path d="M312.64 442 a13 4 0 0 0 26 0" fill="none" stroke="#c4c4cf"/>
<text x="346.64" y="450.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#5b5b70" text-anchor="start">Store</text>
<path d="M400.64 446 L416.64 446" stroke="#9e5b0c" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="426.64,446 415.64,451.5 415.64,440.5" fill="#9e5b0c" stroke="#9e5b0c" stroke-width="1" stroke-linejoin="round"/>
<text x="434.64" y="450.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#5b5b70" text-anchor="start">Step, in the order of the flow</text>
</svg>
