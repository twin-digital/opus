<path d="M582 324 L308 324" fill="none" stroke="#9e5b0c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="298,324 309,318.5 309,329.5" fill="#9e5b0c" stroke="#9e5b0c" stroke-width="1" stroke-linejoin="round"/>
<rect x="339" y="304" width="202" height="40" rx="12" fill="#ffffff" stroke="#9e5b0c"/>
<text x="440" y="321" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#9e5b0c" text-anchor="middle">3. Sends the new snapshot</text>
<text x="440" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#9e5b0c" text-anchor="middle">[SSE]</text>
<path d="M173 272 L173 186" fill="none" stroke="#9e5b0c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="173,176 178.5,187 167.5,187" fill="#9e5b0c" stroke="#9e5b0c" stroke-width="1" stroke-linejoin="round"/>
<rect x="75.6" y="212" width="194.8" height="24" rx="12" fill="#ffffff" stroke="#9e5b0c"/>
<text x="173" y="228.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="12" fill="#9e5b0c" text-anchor="middle">4. Shows the new picture</text>
<rect x="24" y="424" width="832" height="44" rx="12" fill="#ffffff" stroke="#c4c4cf"/>
<text x="40" y="450.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#3f5682" text-anchor="start">Legend</text>
<rect x="100.64" y="438" width="26" height="16" rx="5" fill="#e8ebf0" stroke="#c4c4cf"/>
