<text x="698.72" y="171.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#1c1c2e" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="400" font-size="12" fill="#1c1c2e">GET /snapshots</tspan></text>
