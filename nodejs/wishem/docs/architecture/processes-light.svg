<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 552" width="880" height="552" role="img" aria-labelledby="title desc">
<title id="title">The processes of the workbench</title>
<desc id="desc">The designer runs the start script, which starts the host and the Vite development server in one Node.js process. The page in the web browser gets its code and its snapshots from the Vite development server. The host reads and watches the model folder. The designer edits the model folder by hand.</desc>
<defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#17172a" flood-opacity="0.12"/></filter></defs>
<rect width="880" height="552" fill="#f7f7fa"/>
<rect x="24" y="24" width="288" height="208" rx="18" fill="#eaecf2" stroke="#dedee7"/>
<text x="44" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#3f5682" text-anchor="start" letter-spacing="1.2">WEB BROWSER</text>
<rect x="536" y="24" width="320" height="360" rx="18" fill="#eaecf2" stroke="#dedee7"/>
<text x="556" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="12" fill="#3f5682" text-anchor="start" letter-spacing="1.2">ONE NODE.JS PROCESS</text>
<rect x="44" y="68" width="248" height="140" rx="12" fill="#ffffff" stroke="#c4c4cf" filter="url(#shadow)"/>
<text x="60" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#1c1c2e" text-anchor="start">Page</text>
<text x="60" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#5b5b70" text-anchor="start">Draws the app bar.</text>
<rect x="60" y="135" width="156.4" height="24" rx="12" fill="#e8ebf0"/>
<text x="68" y="151.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#1c1c2e" text-anchor="start">client of the core</text>
<rect x="60" y="165" width="78.4" height="24" rx="12" fill="#e8ebf0"/>
<text x="68" y="181.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#1c1c2e" text-anchor="start">renderer</text>
<rect x="144.4" y="165" width="101.8" height="24" rx="12" fill="#e8ebf0"/>
<text x="152.4" y="181.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#1c1c2e" text-anchor="start">AppBar view</text>
<rect x="556" y="68" width="280" height="140" rx="12" fill="#ffffff" stroke="#c4c4cf" filter="url(#shadow)"/>
<text x="572" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#1c1c2e" text-anchor="start">Vite development server</text>
<text x="572" y="123" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#5b5b70" text-anchor="start">Serves the page and the views.</text>
<text x="572" y="143" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#5b5b70" text-anchor="start">Passes these to the host:</text>
<rect x="572" y="155" width="112.72" height="24" rx="7" fill="#e8ebf0"/>
<text x="580" y="171.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#1c1c2e" text-anchor="start"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="400" font-size="12" fill="#1c1c2e">GET /snapshot</tspan></text>
