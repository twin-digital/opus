<text x="572" y="335" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#5b5b70" text-anchor="start">The core of the workbench.</text>
<rect x="556" y="444" width="280" height="84" rx="12" fill="#ffffff" stroke="#c4c4cf" filter="url(#shadow)"/>
<text x="572" y="476" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="16" fill="#1c1c2e" text-anchor="start">Model folder</text>
<text x="572" y="499" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="13" fill="#5b5b70" text-anchor="start">Definitions and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-weight="400" font-size="12" fill="#1c1c2e">state.json</tspan>.</text>
<rect x="24" y="444" width="288" height="84" rx="12" fill="#f2a93b" stroke="none" filter="url(#shadow)"/>
<text x="168" y="492" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="18" fill="#17172a" text-anchor="middle">Designer</text>
