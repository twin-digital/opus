<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1104" width="880" height="1104" role="img" aria-labelledby="title desc">
<title id="title">Container diagram: Wishem</title>
<desc id="desc">Wishem has six containers. The workbench process runs the host-nodejs package and uses the core package. The host-nodejs and core packages build on the hub package. The workbench process reads and watches the model folder. The page gets page code over HTTP and gets snapshots over SSE from the process. The designer starts the process, edits the model folder, and looks at the page.</desc>
