$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/implementation@1
title: implementation
description: an implementation record — what was implemented, against which fold, with its coverage
type: object
additionalProperties: false
required: [version, product, target, packages, coverage]
properties:
  version:
    const: '1'
  product:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
  target:
    type: integer
    minimum: 1
    description: the design increment whose fold this implementation targeted
  built_at:
    type: string
    pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  packages:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [path, version]
      properties:
        path:
          type: string
        version:
          type: string
  coverage:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [claim, covered_by]
      properties:
        claim:
          type: string
          pattern: '^[rd]-[0-9a-z]{8}$'
        covered_by:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [kind]
            properties:
              kind:
                type: string
                examples: [attestation, code-test, manual-check, conformance-case]
              ref:
                oneOf:
                  - type: string
                  - type: array
                    minItems: 1
                    items:
                      type: string
              note:
                type: string
