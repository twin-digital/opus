$schema: https://json-schema.org/draft/2020-12/schema
$id: /design-process/fact@1
title: fact
description: one finding in the repo-wide facts/ pool
type: object
additionalProperties: false
required: [id, claim, backing, sources]
properties:
  id:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  claim:
    type: string
  backing:
    enum: [tested, documented, assumed]
  status:
    enum: [active, retired]
    description: active when absent
  reason:
    enum: [superseded, disproven, stale]
    description: required when status is retired
  superseded_by:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
    description: required when reason is superseded
  caveat:
    type: string
  sources:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
        run:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        description:
          type: string
        where:
          type: string
        quote:
          type: string
      oneOf:
        - required: [url, where, quote]
        - required: [run, where, quote]
        - required: [description]
allOf:
  - if:
      properties:
        status:
          const: retired
      required: [status]
    then:
      required: [reason]
  - if:
      properties:
        reason:
          const: superseded
      required: [reason]
    then:
      required: [superseded_by]
