# surface: /design-process/ratify-screen@3
#
# What the session renders. The pane layouts and the form of each field are this surface.
# Which entries a list holds, and how a cited id is resolved, are decisions.

screen:
  layout: the header across the top; below it, the open entry list on the left and the detail pane on the right
  lists:
    - decisions, holding the draft's decisions and its open questions
    - requirements, holding the requirements the draft declares
  open-list: one at a time, the body swapping between them; the rule between the header and the body names which
  selection: moving through the list moves the pane
  fit:
    rows: the frame occupies the viewport's rows exactly
    columns: no row runs past the viewport's width; text that would is wrapped or clipped

# The frames a render is diffed against. What they fix is the arrangement, the order of
# things, and the form of each field — everything the sections below state in words.
# Column widths, the separator and rule glyphs, the selection marker, the truncation
# width, and which colours carry an emphasis are the implementer's; a snapshot differing
# from these mocks only in those is conformant.
mock:
  ratify: |
