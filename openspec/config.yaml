schema: superpowers

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  pnpm + turbo TypeScript monorepo (ESM-only, NodeNext). See CLAUDE.md for layout and conventions.
  Every change to package code needs a changeset (`pnpm exec changeset`) selecting every impacted
  package, including private ones; changes touching no package need `pnpm exec changeset --empty`.
  Per-package config (eslint/tsconfig/package.json scripts/tsdown) is generated by repo-kit from
  `.repo-kit.yml`; change it there and run `pnpm sync`, never by editing generated files.

  Spec organization: main specs live at `openspec/specs/<product>/<area>/<capability>/spec.md`, always
  three levels.

  - `<product>` is the package group folder under `nodejs/` (e.g. `minecraft`, `music`, `devtools`),
    except that each package under `nodejs/apps/` is its own product (e.g. `lock-link`), and repo-wide
    behavior (CI/CD, changesets, `tooling/`) uses `opus`.
  - `<area>` names a behavior domain within the product, not a package. It may match a package name
    when that package is a product unit of its own (e.g. `minecraft/dev-kit`); a capability spanning
    several packages goes under the domain it serves.

  Every product with a UI has a `<product>/design-system/component-catalog` spec and a dev-only
  in-app style guide, per `docs/ui-style-guide.md`.

  Diagrams follow `docs/diagrams.md`: Mermaid in temporary content (issues, pull requests, change
  artifacts), rendered SVG files in permanent documentation, and the C4 model for architecture.
  Every product with an architecture document has a `<product>/architecture/diagrams` spec that
  names each required diagram.

  Issue tracking: each change has one primary GitHub issue in `twin-digital/opus`, and each issue
  has at most one change. The issue must exist before the change is created. The change name starts
  with the issue number: `<issue-number>-<kebab-name>` (e.g. `221-add-in-game-ui`). The issue has
  one GitHub issue type (`Feature`, `Bug`, or `Task`) and one product label (`app:<product>`), and
  can belong to one milestone. Relations between issues (blocked by, sub-issue) are recorded on the
  issues in GitHub, never in change artifacts.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  proposal:
    - >-
      Start proposal.md with YAML frontmatter that has two keys: `issue`, the full URL of the
      primary GitHub issue of the change, and `milestone`, the full URL of the milestone of that
      issue (e.g. `https://github.com/twin-digital/opus/milestone/1`). Omit `milestone` when the
      issue has no milestone. List only the primary issue.
    - List new and modified capabilities using their full `<product>/<area>/<capability>` IDs.
    - >-
      When the change adds or changes UI, the look and feel is never already settled: brainstorm
      it with the user before writing the proposal, using the visual companion (when available) 
      to show 2-3 concrete options (layouts, component treatments, token changes) built from the
      product's existing tokens and components. The user picks or adjusts; do not choose for them.
    - >-
      When the change adds or changes UI in a product that has no
      `<product>/design-system/` spec yet, the proposal MUST include a new
      `<product>/design-system/component-catalog` capability that captures the product's
      existing look and feel (tokens, components, required states) as well as this change's
      additions. Establishing it is part of the change, not a follow-up.
    - >-
      When the change adds, removes, or moves an element or a relationship at the C4 context or
      container level (a person, an external system, a process, a service, a deployable unit, a
      store of persisted data), the change MUST add or update the product's architecture document and its diagrams, per `docs/diagrams.md`, and
      list `<product>/architecture/diagrams` as a new or modified capability. A product gets its
      first architecture document when it first has two containers. When the change adds,
      removes, or renames an entity or a relationship in a store of persisted data, it MUST update
      the entity diagram of that store and list `<product>/architecture/diagrams` the same way.
      When the change adds or removes a package, or a dependency between packages, it MUST run
      the render script of the package dependency view. The check `render.mjs --check` fails when
      the files are not current.
      Other changes inside one container need neither.
  design:
    - >-
      When the change adds or changes a public package API or a contract between packages
      (types, function signatures, HTTP/event payloads), include an Interfaces section with the
      TypeScript signatures in fenced code blocks. Show the shape, not the implementation, and
      name the package that will own each one.
    - >-
      When the change adds or changes a persisted data schema, include a Mermaid `erDiagram`
      in a Data Model section showing the affected tables, keys, and relationships with
      cardinality. When it adds or changes domain types in code, include a Mermaid
      `classDiagram` (or `erDiagram` if they are plain ID-linked records) showing types and
      their relationships, and a `stateDiagram-v2` for any entity whose lifecycle changes.
      Diagram only what the change adds or modifies plus the neighbouring entities needed for
      context; list in prose which entities are new or modified. Show only key fields; full
      field definitions belong in the Interfaces section's TypeScript.
    - >-
      When behavior spans multiple components, processes, or services (e.g. server and web
      client, a service and an external API, a scheduled job and its targets), include a
      Mermaid `sequenceDiagram` of the main flow and its significant error paths. Diagram
      only the interactions this change adds or modifies.
    - >-
      When the change alters the C4 context or container level, include each changed C4 diagram
      (system context, container) as a Mermaid `flowchart` with subgraphs that follows the C4
      conventions in `docs/diagrams.md`. Show the whole level after the change, and list in prose
      which elements and relationships are new, moved, or removed.
    - >-
      When the change involves scheduled jobs, external APIs, network calls, or multi-step
      writes, include a Failure Modes table: failure (timeout, partial failure, duplicate or
      concurrent run, invalid upstream data), resulting behavior, and recovery. State whether
      each operation is idempotent, and if not, what prevents duplicate effects.
    - >-
      When the change adds or changes a user-facing surface, include concrete examples: a
      sample terminal session for CLI commands (invocation, output, and at least one error
      case), or a sample request and response for HTTP or event APIs (success and one error).
      Use realistic values rather than placeholders.
    - >-
      When the change touches any package, include a Package Impact table with one row per
      affected package: name, published or private, semver bump (major/minor/patch), and why.
      Include every impacted package, private ones too, and dependents whose behavior changes;
      the changeset must match this table. Call out any breaking change to a published package
      explicitly.
    - >-
      When the change adds or changes UI, include a UI section recording the agreed look and feel:
      the option chosen and why; a text wireframe in a code block for each new or significantly
      changed screen; new or changed components and design tokens as explicit additions to the
      product's style guide, reusing existing components unless the section says why they don't
      fit; the states each new or changed component must cover (loading, empty, error, disabled,
      light and dark); narrow-viewport behavior; and keyboard and focus behavior.
  specs:
    - >-
      In `<product>/architecture/diagrams`, write one requirement for each diagram that
      `docs/diagrams.md` requires: its C4 type, its scope, and its files, with a scenario that ties
      it to the architecture (e.g. WHEN a change adds a container THEN the container diagram shows
      it). Each store of persisted data has one entity diagram requirement, with a scenario that
      ties it to the data (e.g. WHEN a change adds an entity to the store THEN the entity diagram
      shows it). A change that alters the C4 context or container level, or the entities of a
      store, modifies the requirement of each affected diagram.
      A change that adds or removes a package, or a dependency between packages, runs the render
      script of the package dependency view. The check `render.mjs --check` fails when the files
      are not current.
  tasks:
    - >-
      Each task that adds or changes a UI component or design token also updates the product's
      in-app style guide (the component in every state the design lists) and its screenshot
      baselines in the same task, verified by the style guide's screenshot and accessibility
      tests passing. Never defer style-guide work to a later task.
    - >-
      Each task that alters the C4 context or container level, or adds, removes, or renames an
      entity or a relationship in a store of persisted data, also updates the affected diagrams
      (through the product's render script) and the architecture document in the same task. The
      implementer looks at a rendered image of each changed diagram in each theme, per the
      `diagrams` skill. Never defer diagram work to a later task.
      Each task that adds or removes a package, or a dependency between packages, runs the render
      script of the package dependency view. The check `render.mjs --check` fails when the files
      are not current.

